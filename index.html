const $=x=>document.getElementById(x),get=id=>U.find(u=>u.id===id),stars=r=>'★'.repeat(r),lv=id=>S.lv[id]||1,evo=id=>S.evo[id]||0,maxHp=id=>get(id).hp+lv(id)*24+evo(id)*100;
function save(draw=true){localStorage.setItem('astra09',JSON.stringify(S));if(draw)render()}
function recover(){let now=Date.now();if(S.energy>=MAXE){S.energy=MAXE;S.lastEnergy=now;return}let diff=Math.max(0,now-S.lastEnergy),gain=Math.floor(diff/REGEN);if(gain){S.energy=Math.min(MAXE,S.energy+gain);S.lastEnergy+=gain*REGEN;if(S.energy>=MAXE)S.lastEnergy=now;localStorage.setItem('astra09',JSON.stringify(S))}}
function spend(n){recover();if(S.energy<n){alert('⚡スタミナ不足');return false}if(S.energy>=MAXE)S.lastEnergy=Date.now();S.energy-=n;save(false);timerTick();return true}
function timerTick(){recover();$('energy').textContent=S.energy;if(S.energy>=MAXE)$('timer').textContent=' MAX';else{let left=Math.max(0,REGEN-(Date.now()-S.lastEnergy)),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);$('timer').textContent=` ${m}:${String(s).padStart(2,'0')}`}}
setInterval(timerTick,1000);window.addEventListener('pagehide',()=>save(false));document.addEventListener('visibilitychange',()=>{if(document.hidden)save(false);else{recover();render()}});
function style(u){return `--c1:${u.c1};--c2:${u.c2};--skin:${u.skin};--hair:${u.hair};--armor:${u.armor}`}
function card(id){let u=get(id);return `<div class="card ${S.party.includes(id)?'sel':''}" style="${style(u)}" onclick="detail('${id}')"><span class="badge">${u.a} Lv.${lv(id)} +${evo(id)}</span><div class="art"><span class="weapon">${u.icon}</span><span class="faceMark">•ᴗ•</span></div><div class="info"><div class="stars">${stars(u.r)}</div><div class="name">${u.n}</div><div class="stat">HP ${maxHp(id)} / ATK ${u.atk+lv(id)*7+evo(id)*25}</div></div></div>`}
function render(){recover();$('gem').textContent=S.gem;$('energy').textContent=S.energy;$('coin').textContent=S.coin;$('crystal').textContent=S.crystal;$('core').textContent=S.core;$('party').innerHTML=S.party.filter(get).map(card).join('');$('unitsList').innerHTML=Object.keys(S.owned).filter(get).map(card).join('');$('floor').textContent=S.floor;$('eventText').textContent=`月片 ${S.moon} 所持`;$('stages').innerHTML=Q.map((q,i)=>`<button class="stage ${i>S.clear?'lock':''}" ${i>S.clear?'disabled':''} onclick="stage(${i})"><span class="stars">${i===4?'CHAPTER BOSS':'STORY '+(i+1)}</span><br><b>${q.n}</b> — ${q.e}<br><span class="muted">${i<S.clear?'✓ CLEAR':'⚡3'}</span></button>`).join('');$('nextStory').innerHTML=S.clear>=Q.length?'第一章クリア。第二星門の気配が近づいている。':`次：<b>${Q[Math.min(S.clear,Q.length-1)].n}</b><br>第一星門の真実へ近づく。`;$('guide').innerHTML=`⚡は5分で1回復 / 最大30。画面を閉じても経過時間を保存。<br>🔷 ${S.crystal}　🔮 ${S.core}`;timerTick()}
function tab(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function goNextStory(){stage(Math.min(S.clear,Q.length-1))}function stage(i){if(i>S.clear)return;cur=i;let q=Q[i];if(!S.storySeen['pre'+i])openStory(q.story,()=>{S.storySeen['pre'+i]=1;save();setupBattle(i)});else setupBattle(i)}
function setupBattle(i){clearInterval(bTimer);B=null;let q=Q[i];$('battle').classList.add('on');$('result').classList.remove('on');$('enemy').textContent=q.icon;$('enemyName').textContent=q.e;$('enemyHp').style.width='100%';$('enemyHpTxt').textContent=`HP ${q.hp} / ${q.hp}`;$('log').textContent='敵影を確認。AUTO STARTで戦闘開始。';$('auto').textContent='▶ AUTO START';drawFighters(S.party.map(id=>({id,hp:maxHp(id)})));setTimeout(()=>$('battle').scrollIntoView({behavior:'smooth'}),80)}
function drawFighters(a){$('fighters').innerHTML=a.map((x,i)=>{let u=get(x.id),p=Math.max(0,x.hp/maxHp(x.id)*100);return `<div id="f${i}" class="fighter ${x.hp<=0?'dead':''}" style="${style(u)}"><div class="mini">${u.icon}</div><div class="fName">${u.n}</div><div class="miniHp"><i style="width:${p}%"></i></div></div>`}).join('')}
function setSpeed(n,b){speed=n;document.querySelectorAll('.speed button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(B&&B.running){clearInterval(bTimer);bTimer=setInterval(step,Math.round(760/speed))}}
function toggleBattle(){if(B&&B.running){B.running=false;clearInterval(bTimer);$('auto').textContent='▶ AUTO RESUME';return}if(!B){if(!spend(3))return;B={eh:Q[cur].hp,turn:0,running:true,p:S.party.map(id=>({id,hp:maxHp(id)}))}}else B.running=true;$('auto').textContent='Ⅱ AUTO PAUSE';bTimer=setInterval(step,Math.round(760/speed))}
function step(){if(!B||!B.running)return;let q=Q[cur],alive=B.p.map((x,i)=>[x,i]).filter(([x])=>x.hp>0);if(!alive.length)return finish(false);B.turn++;let [x,i]=alive[(B.turn-1)%alive.length],u=get(x.id),skill=B.turn%4===0,d=Math.floor((u.atk+lv(x.id)*7+evo(x.id)*25)*(skill?1.9:1)*(0.9+Math.random()*.2));B.eh-=d;let f=$('f'+i);if(f){f.classList.add('atk');setTimeout(()=>f.classList.remove('atk'),350)}$('enemy').classList.add('hit');setTimeout(()=>$('enemy').classList.remove('hit'),260);$('dmg').className='dmg';$('dmg').textContent='-'+d;if(skill){$('skill').textContent=`${u.icon} ${u.sk}`;$('skill').classList.remove('on');void $('skill').offsetWidth;$('skill').classList.add('on')}if(skill&&u.heal)B.p.forEach(y=>y.hp=Math.min(maxHp(y.id),y.hp+190));updateEnemy();$('log').innerHTML=`${skill?'✨ '+u.sk:'⚔️ '+u.n} → ${d}<br>`+$('log').innerHTML;if(B.eh<=0)return setTimeout(()=>finish(true),300);setTimeout(()=>enemyTurn(q),Math.round(330/speed))}
function enemyTurn(q){if(!B||!B.running||B.eh<=0)return;let alive=B.p.map((x,i)=>[x,i]).filter(([x])=>x.hp>0);if(!alive.length)return finish(false);let [t,i]=alive[Math.floor(Math.random()*alive.length)],d=Math.floor(q.atk*(.85+Math.random()*.3));t.hp-=d;$('enemy').classList.add('attack');setTimeout(()=>$('enemy').classList.remove('attack'),400);drawFighters(B.p);let f=$('f'+i);if(f){f.classList.add('hurt');setTimeout(()=>f.classList.remove('hurt'),260)}$('log').innerHTML=`<span style="color:#ff8197">${q.e} → ${get(t.id).n} ${d}</span><br>`+$('log').innerHTML;if(B.p.every(x=>x.hp<=0))setTimeout(()=>finish(false),300)}
function updateEnemy(){let q=Q[cur],p=Math.max(0,B.eh/q.hp*100);$('enemyHp').style.width=p+'%';$('enemyHpTxt').textContent=`HP ${Math.max(0,B.eh)} / ${q.hp}`}
function finish(win){clearInterval(bTimer);B.running=false;let r=$('result');r.classList.add('on');if(win){let first=cur>=S.clear;S.clear=Math.max(S.clear,cur+1);S.coin+=450;S.crystal+=120;S.gem+=first?300:30;save();r.innerHTML=`<div><div class="victory">VICTORY</div><p>🪙450　🔷120　💎${first?300:30}</p><button class="btn gold" onclick="closeResult(true)">物語の続きを見る</button></div>`}else r.innerHTML=`<div><div class="victory" style="color:#ff718a">DEFEAT</div><button class="btn" onclick="closeResult(false)">戻る</button></div>`}
function closeResult(win){$('result').classList.remove('on');$('battle').classList.remove('on');if(win)openStory(Q[cur].story,()=>{},true)}
function openStory(key,done,post=false){let a=STORY[key],c=Math.ceil(a.length/2);storyQueue=post?a.slice(c):a.slice(0,c);storyDone=done;$('story').classList.add('on');storyNext()}function storyNext(){if(!storyQueue.length){$('story').classList.remove('on');let f=storyDone;storyDone=null;if(f)f();return}let [s,d]=storyQueue.shift();$('speaker').textContent=s;$('dialog').textContent=d}
function farm(t){let c=t==='core'?4:3;if(!spend(c))return;if(t==='crystal'){let n=180+Math.floor(Math.random()*141);S.crystal+=n;alert(`🔷 ${n}獲得`)}if(t==='core'){let n=45+Math.floor(Math.random()*46);S.core+=n;alert(`🔮 ${n}獲得`)}if(t==='coin'){let n=700+Math.floor(Math.random()*501);S.coin+=n;alert(`🪙 ${n}獲得`)}save()}function eventBattle(){if(!spend(5))return;let n=12+Math.floor(Math.random()*14);S.moon+=n;S.crystal+=80;alert(`🌙月片 +${n} / 🔷+80`);save()}function tower(){if(!spend(2))return;S.floor++;S.crystal+=60;alert(`塔 ${S.floor-1}階突破！`);save()}
function detail(id){did=id;let u=get(id),a=$('detailArt');a.style.cssText=style(u);a.textContent=u.icon;$('detailStars').textContent=stars(u.r)+' '+u.a;$('detailName').textContent=u.n;$('detailStat').innerHTML=`Lv.${lv(id)}　進化 +${evo(id)}　所持 ${S.owned[id]}体<br>HP <b>${maxHp(id)}</b>　ATK <b>${u.atk+lv(id)*7+evo(id)*25}</b>`;$('detailSkill').textContent='必殺技：'+u.sk;$('detailDesc').textContent=u.d;$('partyBtn').textContent=S.party.includes(id)?'編成解除':'部隊に編成';$('partyBtn').onclick=()=>partyToggle(id);$('detail').classList.add('on')}function closeDetail(){$('detail').classList.remove('on')}function partyToggle(id){let i=S.party.indexOf(id);if(i>=0&&S.party.length>1)S.party.splice(i,1);else if(i<0&&S.party.length<3)S.party.push(id);save();detail(id)}function levelUp(){if(S.crystal<100)return alert('🔷不足');S.crystal-=100;S.lv[did]=lv(did)+1;save();detail(did)}function evolve(){if((S.owned[did]||0)<2)return alert('同名ユニットが必要');if(S.core<100)return alert('🔮不足');S.owned[did]--;S.core-=100;S.evo[did]=evo(did)+1;save();detail(did)}
function rarity(){if(S.p7>=99)return 7;if(S.p5>=29)return Math.random()<.2?7:5;let x=Math.random()*100;return x<3?7:x<10?6:x<30?5:x<60?4:3}
function pull(n){if(S.gem<n*300)return alert('💎不足');S.gem-=n*300;fxR=[];for(let i=0;i<n;i++){S.p5++;S.p7++;let r=rarity();if(r>=5)S.p5=0;if(r===7)S.p7=0;let pool=U.filter(u=>u.r===r),u=pool[Math.floor(Math.random()*pool.length)];S.owned[u.id]=(S.owned[u.id]||0)+1;fxR.push(u)}save(false);startFx()}
function clearFxTimers(){fxTimers.forEach(clearTimeout);fxTimers=[]}function startFx(){clearFxTimers();fxIndex=0;$('fx').classList.add('on');$('reveal').classList.remove('on');$('tap').style.display='none';$('fxMsg').textContent='星門を起動します…';fxTimers.push(setTimeout(()=>$('fxMsg').textContent='星の力が集まっていく…',850));fxTimers.push(setTimeout(()=>{$('fxMsg').textContent=fxR.some(u=>u.r===7)?'――星門が異常共鳴――':fxR.some(u=>u.r>=6)?'――強大な反応――':'運命が動き出す…';$('gate').style.borderColor=fxR.some(u=>u.r===7)?'#fff07a':fxR.some(u=>u.r>=6)?'#d76cff':'#68aaff'},1650));fxTimers.push(setTimeout(()=>{$('fxMsg').textContent='門を開け';$('tap').style.display='block'},2450))}
function tapReveal(){$('tap').style.display='none';showReveal()}function showReveal(){if(fxIndex>=fxR.length)return finishSummon();let u=fxR[fxIndex++],r=$('reveal'),a=$('revealArt');a.style.cssText=style(u);a.textContent=u.icon;$('revealStars').textContent=stars(u.r);$('revealName').textContent=u.n;r.classList.add('on');r.onclick=()=>{r.onclick=null;r.classList.remove('on');setTimeout(showReveal,150)}}function skipFx(){clearFxTimers();finishSummon()}function finishSummon(){clearFxTimers();$('fx').classList.remove('on');$('reveal').classList.remove('on');$('pullResults').innerHTML=fxR.map(u=>`<div class="miniCard r${u.r}" style="${style(u)}"><div class="miniArt">${u.icon}</div><div class="miniInfo"><span class="stars">${stars(u.r)}</span><br>${u.n}</div></div>`).join('');save()}
render();
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASTRA LEGION</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080b18;color:#fff;font-family:-apple-system,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:16px 14px 90px;background:radial-gradient(circle at top,#35225f,#11152a 40%,#080b18)}h1{font-size:22px}.bar,.panel{background:#ffffff0d;border:1px solid #ffffff18;border-radius:16px;padding:13px;margin:10px 0}.bar{display:flex;gap:10px}.pill{background:#0004;padding:7px 10px;border-radius:99px}.btn{border:0;border-radius:13px;padding:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7555ff,#cf4fff)}.gold{background:linear-gradient(135deg,#e99818,#ffd768);color:#291700}.row{display:flex;gap:8px}.row>*{flex:1}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#0d1122;border:1px solid #ffffff1c;border-radius:13px;padding:9px}.sel{outline:2px solid #ffd85b}.face{font-size:38px}.stars{color:#ffd65c}.small{font-size:12px;color:#aeb5d4}.enemy{text-align:center}.enemy .face{font-size:70px}.hp{height:12px;background:#30354a;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:#ff5575}.log{height:150px;overflow:auto;background:#050711;padding:8px;border-radius:10px;font-size:12px}.good{color:#70efae}.bad{color:#ff8095}.screen{display:none}.on{display:block}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#0c1020f5;padding:8px 5px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ffffff1c}nav button{background:none;border:0;color:#c6cbea;font-size:11px}nav b{display:block;font-size:20px}.orb{text-align:center;font-size:90px;animation:f 2s infinite ease-in-out}@keyframes f{50%{transform:translateY(-8px);filter:drop-shadow(0 0 25px #bc6cff)}}.stage{width:100%;margin:5px 0;padding:12px;text-align:left;background:#171d35;border:1px solid #ffffff1c;border-radius:12px;color:#fff}.lock{opacity:.4}</style></head>
<body><div class="app"><h1>🌌 ASTRA LEGION <span class="small">v0.2</span></h1><div class="bar"><span class="pill">💎 <b id="gem">6000</b></span><span class="pill">⚡ <b id="en">20</b>/20</span><span class="pill">🪙 <b id="coin">0</b></span></div>
<section id="home" class="screen on"><div class="panel"><div class="orb">🔮</div><h2>星界へようこそ</h2><p class="small">ガチャ → 編成 → オート戦闘 → 育成。最初からちゃんと遊べる。</p></div><div class="panel"><h3>現在の部隊</h3><div id="party" class="cards"></div></div></section>
<section id="quest" class="screen"><div class="panel"><h2>QUEST</h2><div id="stages"></div></div><div id="battleBox" class="panel" style="display:none"><div class="enemy"><div id="ef" class="face"></div><b id="ename"></b><div class="hp"><i id="ehp"></i></div><div id="ehpt" class="small"></div></div><button class="btn" style="width:100%;margin:10px 0" onclick="fight()">⚔️ AUTO BATTLE</button><div id="log" class="log"></div></div></section>
<section id="summon" class="screen"><div class="panel"><h2>🔮 星門召喚</h2><div class="orb">🌠</div><div id="result" style="text-align:center;font-weight:900;margin:8px">星門は静かに脈動している…</div><p class="small">★7 3% / ★6 7% / ★5 20% / ★4 30% / ★3 40%<br>30回以内★5以上・100回以内★7保証</p><div class="row"><button class="btn" onclick="pull(1)">1回 💎300</button><button class="btn gold" onclick="pull(10)">10回 💎3000</button></div><p class="small">★5+天井まで <b id="p5"></b>　★7天井まで <b id="p7"></b></p></div></section>
<section id="units" class="screen"><div class="panel"><h2>UNIT / 編成</h2><p class="small">タップで編成。最大3人。</p><div id="unitsList" class="cards"></div></div></section></div>
<nav><button onclick="tab('home')"><b>🏠</b>HOME</button><button onclick="tab('quest')"><b>⚔️</b>QUEST</button><button onclick="tab('summon')"><b>🔮</b>SUMMON</button><button onclick="tab('units')"><b>🧙</b>UNIT</button></nav>
<script>
const U=[['leon','炎剣士レオン',3,'🔥',520,120,90],['mina','水術士ミナ',3,'💧',460,110,105],['el','森弓士エル',4,'🌿',590,145,130],['volt','雷将ヴォルト',4,'⚡',620,155,115],['sera','氷姫セラ',5,'❄️',780,190,150],['lumia','聖女ルミア',5,'✨',850,155,125],['gald','竜帝ガルド',6,'🐉',1150,250,120],['chloe','時姫クロエ',6,'⏳',920,220,210],['ares','神徒アレス',6,'⚔️',1050,270,155],['astra','星壊神アストラ',7,'🌠',1550,360,220],['nemesis','虚神ネメシス',7,'🕳️',1450,390,205]];
const E=[['迷いゴブリン','👺',700,65,180],['岩殻ビースト','🦏',1300,95,260],['深淵の番兵','👹',2100,125,380],['星喰い獣','👾',3300,165,550],['界門竜ゼロス','🐲',5200,210,900]];
let S=JSON.parse(localStorage.getItem('astra02')||'null')||{g:6000,e:20,c:0,o:['leon','mina','el'],p:['leon','mina','el'],a:0,b:0,clear:0,lv:{}},cur=0;
const q=x=>document.getElementById(x),unit=id=>U.find(x=>x[0]==id);
function save(){localStorage.setItem('astra02',JSON.stringify(S));render()}
function card(id){let u=unit(id),lv=S.lv[id]||1;return `<div class="card ${S.p.includes(id)?'sel':''}" onclick="pick('${id}')"><div class="face">${u[3]}</div><div class="stars">${'★'.repeat(u[2])}</div><b>${u[1]}</b><div class="small">Lv.${lv} HP ${u[4]+lv*20}<br>ATK ${u[5]+lv*5} / SPD ${u[6]}</div></div>`}
function render(){q('gem').textContent=S.g;q('en').textContent=S.e;q('coin').textContent=S.c;q('p5').textContent=30-S.a;q('p7').textContent=100-S.b;q('party').innerHTML=S.p.map(card).join('');q('unitsList').innerHTML=S.o.map(card).join('');q('stages').innerHTML=E.map((x,i)=>`<button class="stage ${i>S.clear?'lock':''}" ${i>S.clear?'disabled':''} onclick="stage(${i})">${i+1}-1　${x[1]} ${x[0]}　${i<S.clear?'CLEAR':'⚡3'}</button>`).join('')}
function tab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));q(id).classList.add('on');render()}
function pick(id){let i=S.p.indexOf(id);if(i>=0){if(S.p.length>1)S.p.splice(i,1)}else if(S.p.length<3)S.p.push(id);save()}
function rare(){if(S.b>=99)return 7;if(S.a>=29)return Math.random()<.25?7:5;let x=Math.random()*100;return x<3?7:x<10?6:x<30?5:x<60?4:3}
function pull(n){if(S.g<n*300){q('result').textContent='💎不足！クエストへ行こう';return}S.g-=n*300;let out=[];for(let i=0;i<n;i++){S.a++;S.b++;let r=rare();if(r>=5)S.a=0;if(r==7)S.b=0;let p=U.filter(x=>x[2]==r),u=p[Math.floor(Math.random()*p.length)];if(!S.o.includes(u[0]))S.o.push(u[0]);else S.c+=r*50;out.push(u)}out.sort((a,b)=>b[2]-a[2]);let u=out[0];q('result').innerHTML=`${'★'.repeat(u[2])} ${u[3]} ${u[1]}<div class="small">${n}体召喚完了・最高レア表示</div>`;save()}
function stage(i){cur=i;let x=E[i];q('battleBox').style.display='block';q('ef').textContent=x[1];q('ename').textContent=x[0];q('ehp').style.width='100%';q('ehpt').textContent='HP '+x[2];q('log').innerHTML='<span class="good">出撃準備完了。</span>';q('battleBox').scrollIntoView({behavior:'smooth'})}
function fight(){if(S.e<3){q('log').innerHTML+='<div class="bad">エネルギー不足</div>';return}S.e-=3;let e={hp:E[cur][2],atk:E[cur][3]},ps=S.p.map(id=>{let u=unit(id),lv=S.lv[id]||1;return {u,lv,hp:u[4]+lv*20}}),l=[];for(let r=1;r<=30&&e.hp>0&&ps.some(x=>x.hp>0);r++){ps.filter(x=>x.hp>0).sort((a,b)=>b.u[6]-a.u[6]).forEach(x=>{if(e.hp<=0)return;let d=Math.floor((x.u[5]+x.lv*5)*(.85+Math.random()*.3)*(r%3?1:1.65));e.hp-=d;l.push(`${x.u[1]} → ${d} damage${r%3?'':' ✨SKILL!'}`)});if(e.hp>0){let a=ps.filter(x=>x.hp>0),t=a[Math.floor(Math.random()*a.length)],d=Math.floor(e.atk*(.85+Math.random()*.3));t.hp-=d;l.push(`<span class="bad">${E[cur][0]} → ${t.u[1]} ${d}</span>`)}}q('ehp').style.width=Math.max(0,e.hp/E[cur][2]*100)+'%';q('ehpt').textContent='HP '+Math.max(0,e.hp)+' / '+E[cur][2];if(e.hp<=0){let rw=E[cur][4];S.g+=rw;S.c+=rw;S.clear=Math.max(S.clear,Math.min(E.length-1,cur+1));S.p.forEach(id=>S.lv[id]=(S.lv[id]||1)+1);l.push(`<span class="good">🏆 VICTORY！ 💎${rw} / 部隊Lv+1</span>`)}else l.push('<span class="bad">敗北…編成を見直そう。</span>');q('log').innerHTML=l.slice(-18).join('<br>');save()}
render();
</script></body></html>

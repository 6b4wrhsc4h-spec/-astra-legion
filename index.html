<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ASTRA LEGION v0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020510;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;color:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding:0 11px 96px;background:radial-gradient(circle at 50% -5%,#173768,#071126 35%,#020510 80%)}header{position:sticky;top:0;z-index:30;margin:0 -11px;padding:8px 11px;background:#030817ef;border-bottom:1px solid #d9b65b55;backdrop-filter:blur(12px)}.brand{font:800 19px Georgia}.ver{font:11px sans-serif;color:#a8b8d8}.res{display:flex;gap:5px;margin-top:5px}.pill{background:#0a1730;border:1px solid #fff2;border-radius:99px;padding:5px 7px;font-size:11px}.screen{display:none}.screen.on{display:block}.hero{height:315px;margin:0 -11px;position:relative;background:url("astra_v04_art.png") 16% 14%/205% auto no-repeat}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#071126,transparent 52%),linear-gradient(90deg,transparent,#061024aa)}.heroText{position:absolute;z-index:2;bottom:25px;right:15px;text-align:right;text-shadow:0 3px 12px #000}.heroText h1{font:800 31px Georgia;margin:0}.gold{color:#ffe07b}.panel{margin:11px 0;padding:12px;background:linear-gradient(145deg,#0b1831e8,#07101fe8);border:1px solid #d8b85a40;border-radius:15px;box-shadow:0 10px 30px #0005}h2,h3{margin:2px 0 9px}.muted{font-size:11px;color:#aebbd2}.btn{border:1px solid #e5cb7655;border-radius:12px;padding:11px;font-weight:800;background:linear-gradient(135deg,#1d4aa1,#6544ba)}.btn.goldbtn{background:linear-gradient(135deg,#a76a15,#f1cb62);color:#241500}.row{display:flex;gap:7px}.row>*{flex:1}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{position:relative;overflow:hidden;border:1px solid #fff2;border-radius:12px;background:#07101f;padding:8px}.card.sel{outline:2px solid #f2cf68}.portrait{height:132px;margin:-8px -8px 7px;background:url("astra_v04_art.png") center/cover no-repeat}.p0{background-position:17% 14%;background-size:205%}.p1{background-position:18% 55%;background-size:300%}.p2{background-position:34% 55%;background-size:300%}.p3{background-position:50% 55%;background-size:300%}.p4{background-position:65% 55%;background-size:300%}.stars{color:#ffd65b;text-shadow:0 0 8px #ffb400}.badge{position:absolute;right:5px;top:5px;background:#041021dd;border:1px solid #e7ca6a77;border-radius:7px;padding:3px 5px;font-size:9px}.name{font-weight:800;font-size:12px}.stat{font-size:9px;color:#aab7cf}.stage{width:100%;margin:6px 0;padding:12px;display:flex;justify-content:space-between;background:#101d38;border:1px solid #fff2;border-radius:11px}.stage.lock{opacity:.35}.enemyPic{height:200px;border-radius:14px;background:url("astra_v04_art.png") 75% 56%/215% auto no-repeat}.hp{height:12px;background:#292e40;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:linear-gradient(90deg,#e52e58,#ff9854);transition:.35s}.log{height:145px;overflow:auto;background:#02050c;padding:8px;border-radius:9px;font-size:10px;line-height:1.5}.good{color:#79f0af}.bad{color:#ff8299}
.summonBanner{height:230px;margin:-12px -12px 8px;background:url("astra_v04_art.png") 75% 15%/205% auto no-repeat;border-radius:15px 15px 0 0}.equip{display:flex;gap:10px;align-items:center}.sword{font-size:55px;filter:drop-shadow(0 0 12px #6dafff)}.event{height:190px;background:url("astra_v04_art.png") 91% 86%/290% auto no-repeat;border-radius:12px}
.detail{position:fixed;inset:0;z-index:80;background:#020611f2;display:none;overflow:auto;padding:18px 13px 100px}.detail.on{display:block}.detailArt{height:390px;border-radius:16px;background:url("astra_v04_art.png") 17% 14%/205% auto no-repeat;border:1px solid #e6c66266}.close{position:fixed;z-index:90;right:16px;top:16px;border:1px solid #fff4;background:#071020dd;border-radius:99px;padding:9px 12px}
nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:#030817f5;border-top:1px solid #d8b85a44;padding:6px 2px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}nav button{border:0;background:none;color:#98a7c4;font-size:8px;padding:2px}nav b{display:block;font-size:18px}nav button.on{color:#ffe083}
.gfx{position:fixed;inset:0;z-index:120;display:none;overflow:hidden;background:#01030b}.gfx.on{display:block}.space{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#193c8e 0,#090e31 34%,#01030b 72%)}.starsfx{position:absolute;inset:-50%;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px;animation:zoom 3s linear infinite}.gate{position:absolute;left:50%;top:45%;width:185px;height:185px;transform:translate(-50%,-50%);border:5px solid #7acbff;border-radius:50%;box-shadow:0 0 35px #5ec8ff,0 0 100px #5c48ff,inset 0 0 40px #7ed7ff;animation:spin 1.4s linear infinite}.gate:before,.gate:after{content:"";position:absolute;inset:20px;border:3px dashed #fff;border-radius:50%;animation:spin .8s linear infinite reverse}.gate:after{inset:60px;background:#fff;border:0;box-shadow:0 0 45px #fff,0 0 100px #8fcaff;animation:pulse .7s infinite alternate}.gfx.goldfx .space{background:radial-gradient(circle,#fff3a0,#713db5 30%,#10154c 52%,#01030b)}.gfx.goldfx .gate{border-color:#ffe36a;box-shadow:0 0 40px #ffe676,0 0 130px #d346ff}.crack{position:absolute;inset:0;opacity:0;background:linear-gradient(35deg,transparent 48%,#fff 49%,transparent 51%),linear-gradient(145deg,transparent 48%,#fff 49%,transparent 51%)}.crack.on{opacity:1;animation:flash .8s}.msg{position:absolute;bottom:17%;left:0;right:0;text-align:center;font:900 20px Georgia;letter-spacing:2px;text-shadow:0 2px 10px #000}.skip{position:absolute;right:15px;top:18px;z-index:4;background:#071020cc;border:1px solid #fff5;border-radius:99px;padding:8px 12px}.tap{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);padding:11px 28px;border-radius:99px;border:1px solid #ffe477;background:#a56b19;display:none;font-weight:900}.results{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.resultCard{padding:7px 2px;text-align:center;border-radius:8px;background:#0b1730;border:1px solid #fff2;font-size:8px}.r7{box-shadow:0 0 18px #ffe36b;border-color:#ffe36b}.r6{box-shadow:0 0 12px #ba78ff;border-color:#ba78ff}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes pulse{to{transform:scale(1.55);opacity:.55}}@keyframes zoom{to{transform:scale(1.25) rotate(5deg)}}@keyframes flash{50%{filter:brightness(5)}}
</style></head><body><div class="app">
<header><div class="brand">ASTRA LEGION <span class="ver">v0.4</span></div><div class="res"><span class="pill">💎 <b id="gem"></b></span><span class="pill">⚡ <b id="energy"></b>/30 <small id="et"></small></span><span class="pill">🪙 <b id="coin"></b></span></div></header>
<section id="home" class="screen on"><div class="hero"><div class="heroText"><div class="gold">★7 CELESTIAL</div><h1>星冠神<br>アストラ</h1><b>「星界の扉を、いま開く。」</b></div></div><div class="panel"><h3>現在の部隊</h3><div id="party" class="cards"></div></div><div class="panel"><h3>デイリーミッション</h3><div class="muted">クエスト3回　0/3　　召喚1回　0/1</div></div></section>
<section id="quest" class="screen"><div class="panel"><h2>⚔️ 星界クエスト</h2><div id="stages"></div></div><div id="battle" class="panel" style="display:none"><div class="enemyPic"></div><h3 id="en"></h3><div class="hp"><i id="ehp"></i></div><div id="ehpt" class="muted"></div><button class="btn" style="width:100%;margin:9px 0" onclick="fight()">AUTO BATTLE</button><div id="log" class="log"></div></div></section>
<section id="summon" class="screen"><div class="panel"><div class="summonBanner"></div><h2>🌠 星門召喚</h2><div class="muted">★7 3% / ★6 7% / ★5 20%　30回★5+保証 / 100回★7保証</div><div class="row" style="margin-top:9px"><button class="btn" onclick="pull(1)">1回 💎300</button><button class="btn goldbtn" onclick="pull(10)">10連 💎3000</button></div><div id="summonResult" class="results"></div></div></section>
<section id="units" class="screen"><div class="panel"><h2>🛡 キャラクター</h2><div id="unitsList" class="cards"></div></div></section>
<section id="equip" class="screen"><div class="panel"><h2>⚒️ 装備</h2><div class="equip"><div class="sword">🗡️</div><div><div class="stars">★★★★★★★</div><h3>星屑の剣</h3><div>ATK +125　会心 +15%</div></div></div><button class="btn goldbtn" style="width:100%;margin-top:12px" onclick="upgradeWeapon()">強化 🪙500</button><div id="weaponLv" class="muted"></div></div></section>
<section id="event" class="screen"><div class="panel"><div class="event"></div><h2>🌙 月下の郷</h2><p class="muted">期間限定イベント。高難度ボスから限定装備を獲得せよ。</p><button class="btn goldbtn" style="width:100%" onclick="alert('イベントクエストは次章で解放！')">イベントへ</button></div></section>
</div>
<div id="detail" class="detail"><button class="close" onclick="closeDetail()">✕</button><div id="detailArt" class="detailArt"></div><div class="panel"><div id="ds" class="stars"></div><h2 id="dn"></h2><div id="dst"></div><hr style="border-color:#fff2"><h3 id="dsk"></h3><p id="dd" class="muted"></p><div class="row"><button id="pb" class="btn goldbtn"></button><button class="btn" onclick="levelUp()">育成 🪙200</button></div></div></div>
<div id="gfx" class="gfx" onclick="tapReveal()"><div class="space"></div><div class="starsfx"></div><div class="gate"></div><div id="crack" class="crack"></div><button class="skip" onclick="event.stopPropagation();finishGacha()">SKIP</button><div id="gm" class="msg">星門同期中...</div><button id="tap" class="tap">TAP TO REVEAL</button></div>
<nav><button class="on" onclick="tab('home',this)"><b>🏠</b>HOME</button><button onclick="tab('quest',this)"><b>⚔️</b>QUEST</button><button onclick="tab('summon',this)"><b>🌠</b>召喚</button><button onclick="tab('units',this)"><b>🛡</b>キャラ</button><button onclick="tab('equip',this)"><b>🗡️</b>装備</button><button onclick="tab('event',this)"><b>🌙</b>EVENT</button></nav>
<script>
const U=[
{id:'leon',n:'炎剣士レオン',r:3,a:'炎',hp:650,atk:130,spd:92,sk:'紅蓮斬',d:'炎属性の強撃。',p:4},{id:'mina',n:'水術士ミナ',r:3,a:'水',hp:590,atk:122,spd:110,sk:'蒼流弾',d:'水魔法による高速攻撃。',p:3},{id:'el',n:'森弓士エル',r:4,a:'森',hp:720,atk:158,spd:142,sk:'翠穿ち',d:'高速の貫通矢。',p:2},{id:'volt',n:'雷将ヴォルト',r:4,a:'雷',hp:780,atk:172,spd:126,sk:'雷迅撃',d:'雷を纏う強撃。',p:1},{id:'sera',n:'氷姫セラ',r:5,a:'氷',hp:930,atk:215,spd:162,sk:'氷華葬',d:'氷華を爆発させる。',p:3},{id:'lumia',n:'聖女ルミア',r:5,a:'光',hp:1010,atk:170,spd:136,sk:'星癒の祈り',d:'攻撃＋味方全体回復。',p:2,heal:1},{id:'gald',n:'竜帝ガルド',r:6,a:'炎',hp:1320,atk:282,spd:128,sk:'竜星砕',d:'超重量の竜撃。',p:4},{id:'chloe',n:'時姫クロエ',r:6,a:'時',hp:1080,atk:245,spd:222,sk:'クロノブレイク',d:'時を裂く超高速攻撃。',p:1},{id:'ares',n:'神徒アレス',r:6,a:'光',hp:1210,atk:295,spd:168,sk:'神威連斬',d:'神速の連続斬撃。',p:2},{id:'astra',n:'星冠神アストラ',r:7,a:'光',hp:1680,atk:400,spd:230,sk:'アストラル・ノヴァ',d:'星界大爆発＋味方全体回復。',p:0,heal:1},{id:'nemesis',n:'虚神ネメシス',r:7,a:'闇',hp:1580,atk:440,spd:214,sk:'虚無終焉',d:'防御を穿つ虚無の一撃。',p:4}];
const E=[['迷いゴブリン',950,65,220],['岩殻ビースト',1650,95,330],['深淵の番兵',2700,130,470],['星喰い獣',4100,175,680],['界門竜ゼロス',6300,225,1050]];
let S=JSON.parse(localStorage.getItem('astra04')||'null')||{gem:12340,energy:30,energyAt:Date.now(),coin:1250,owned:['leon','mina','el','lumia'],party:['leon','mina','lumia'],p5:0,p7:0,clear:0,lv:{},weapon:1};if(!S.energyAt)S.energyAt=Date.now();let cur=0,did='',pending=[];
const $=x=>document.getElementById(x),get=id=>U.find(u=>u.id===id),stars=r=>'★'.repeat(r);
function recover(){let now=Date.now(),step=300000;if(S.energy>=30){S.energy=30;S.energyAt=now}else{let g=Math.floor((now-S.energyAt)/step);if(g){S.energy=Math.min(30,S.energy+g);S.energyAt+=g*step}}}
function timer(){recover();$('energy').textContent=S.energy;if(S.energy>=30)$('et').textContent='MAX';else{let x=300000-((Date.now()-S.energyAt)%300000),m=Math.floor(x/60000),q=Math.floor(x%60000/1000);$('et').textContent=`+1 ${m}:${String(q).padStart(2,'0')}`}localStorage.setItem('astra04',JSON.stringify(S))}
function card(id){let u=get(id),l=S.lv[id]||1;return `<div class="card ${S.party.includes(id)?'sel':''}" onclick="detail('${id}')"><span class="badge">${u.a} Lv.${l}</span><div class="portrait p${u.p}"></div><div class="stars">${stars(u.r)}</div><div class="name">${u.n}</div><div class="stat">HP ${u.hp+l*24} / ATK ${u.atk+l*7}</div></div>`}
function render(){recover();$('gem').textContent=S.gem;$('energy').textContent=S.energy;$('coin').textContent=S.coin;$('party').innerHTML=S.party.map(card).join('');$('unitsList').innerHTML=S.owned.map(card).join('');$('weaponLv').textContent=`Lv.${S.weapon}　強化値 +${S.weapon*5}`;$('stages').innerHTML=E.map((e,i)=>`<button class="stage ${i>S.clear?'lock':''}" ${i>S.clear?'disabled':''} onclick="stage(${i})"><span>${i+1}-1 ${e[0]}</span><b>${i<S.clear?'CLEAR':'⚡3'}</b></button>`).join('')}
function save(){localStorage.setItem('astra04',JSON.stringify(S));render()}
function tab(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function detail(id){did=id;let u=get(id),l=S.lv[id]||1;$('detailArt').className='detailArt p'+u.p;$('ds').textContent=stars(u.r)+' '+u.a;$('dn').textContent=u.n;$('dst').innerHTML=`Lv.${l}　HP <b>${u.hp+l*24}</b>　ATK <b>${u.atk+l*7}</b>　SPD <b>${u.spd}</b>`;$('dsk').textContent='必殺技：'+u.sk;$('dd').textContent=u.d;$('pb').textContent=S.party.includes(id)?'編成解除':'部隊に編成';$('pb').onclick=()=>partyToggle(id);$('detail').classList.add('on')}
function closeDetail(){$('detail').classList.remove('on')}function partyToggle(id){let i=S.party.indexOf(id);if(i>=0&&S.party.length>1)S.party.splice(i,1);else if(i<0&&S.party.length<3)S.party.push(id);save();detail(id)}
function levelUp(){if(S.coin<200)return alert('コイン不足');S.coin-=200;S.lv[did]=(S.lv[did]||1)+1;save();detail(did)}function upgradeWeapon(){if(S.coin<500)return alert('コイン不足');S.coin-=500;S.weapon++;save()}
function rarity(){if(S.p7>=99)return 7;if(S.p5>=29)return Math.random()<.2?7:5;let x=Math.random()*100;return x<3?7:x<10?6:x<30?5:x<60?4:3}
function pull(n){if(S.gem<n*300)return alert('💎不足');S.gem-=n*300;pending=[];for(let i=0;i<n;i++){S.p5++;S.p7++;let r=rarity();if(r>=5)S.p5=0;if(r==7)S.p7=0;let P=U.filter(u=>u.r==r),u=P[Math.floor(Math.random()*P.length)];if(!S.owned.includes(u.id))S.owned.push(u.id);else S.coin+=r*60;pending.push(u)}pending.sort((a,b)=>b.r-a.r);startFx()}
function startFx(){let top=pending[0],fx=$('gfx');fx.className='gfx on'+(top.r==7?' goldfx':'');$('gm').textContent='星門同期中...';$('tap').style.display='none';$('crack').className='crack';setTimeout(()=>$('gm').textContent='星核反応を検出...',1200);setTimeout(()=>{if(top.r>=6){$('crack').className='crack on';$('gm').textContent=top.r==7?'――異常な星力反応――':'高位反応…！'}else $('gm').textContent='光が収束する…'},2600);setTimeout(()=>{$('gm').textContent='運命を解放せよ';$('tap').style.display='block'},4300)}
function tapReveal(){if($('tap').style.display!='block')return;let u=pending[0];$('tap').style.display='none';$('crack').className='crack on';$('gm').innerHTML=`<span class="stars" style="font-size:27px">${stars(u.r)}</span><br>${u.n}`;setTimeout(finishGacha,1900)}
function finishGacha(){$('gfx').className='gfx';$('summonResult').innerHTML=pending.map(u=>`<div class="resultCard r${u.r}"><div class="stars">${stars(u.r)}</div>${u.n}</div>`).join('');save()}
function stage(i){cur=i;$('battle').style.display='block';$('en').textContent=E[i][0];$('ehp').style.width='100%';$('ehpt').textContent=`HP ${E[i][1]} / ${E[i][1]}`;$('log').innerHTML='<span class="good">部隊出撃。戦闘開始。</span>';$('battle').scrollIntoView({behavior:'smooth'})}
function fight(){if(S.energy<3)return $('log').innerHTML+='<div class="bad">⚡不足</div>';if(S.energy==30)S.energyAt=Date.now();S.energy-=3;let e={hp:E[cur][1],atk:E[cur][2]},P=S.party.map(id=>{let u=get(id),l=S.lv[id]||1;return{u,l,hp:u.hp+l*24,max:u.hp+l*24}}),L=[];for(let r=1;r<=30&&e.hp>0&&P.some(x=>x.hp>0);r++){P.filter(x=>x.hp>0).sort((a,b)=>b.u.spd-a.u.spd).forEach(x=>{if(e.hp<=0)return;let sk=r%3==0,d=Math.floor((x.u.atk+x.l*7)*(.9+Math.random()*.2)*(sk?1.85:1)*(1+S.weapon*.01));e.hp-=d;L.push(`${sk?'✨ '+x.u.sk:'⚔️ '+x.u.n} → ${d}`);if(sk&&x.u.heal){P.forEach(q=>q.hp=Math.min(q.max,q.hp+200));L.push('<span class="good">✦ 全体回復</span>')}});if(e.hp>0){let A=P.filter(x=>x.hp>0),t=A[Math.floor(Math.random()*A.length)],d=Math.floor(e.atk*(.85+Math.random()*.3));t.hp-=d;L.push(`<span class="bad">${E[cur][0]} → ${t.u.n} ${d}</span>`)}}$('ehp').style.width=Math.max(0,e.hp/E[cur][1]*100)+'%';$('ehpt').textContent=`HP ${Math.max(0,e.hp)} / ${E[cur][1]}`;if(e.hp<=0){let rw=E[cur][3];S.gem+=rw;S.coin+=rw;S.clear=Math.max(S.clear,Math.min(E.length-1,cur+1));S.party.forEach(id=>S.lv[id]=(S.lv[id]||1)+1);L.push(`<span class="good">🏆 VICTORY 💎${rw} 🪙${rw} Lv+1</span>`)}else L.push('<span class="bad">DEFEAT</span>');$('log').innerHTML=L.slice(-22).join('<br>');save()}
render();timer();setInterval(timer,1000);
</script></body></html>

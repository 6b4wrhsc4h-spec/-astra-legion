<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASTRA LEGION v0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020611;color:#f7f4e9;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}button{font:inherit;color:inherit}
.app{max-width:520px;margin:auto;min-height:100vh;padding:0 12px 94px;background:radial-gradient(circle at 50% 0,#173363 0,#071126 36%,#020611 75%)}
header{position:sticky;top:0;z-index:30;margin:0 -12px;padding:8px 12px;background:#030916e8;backdrop-filter:blur(12px);border-bottom:1px solid #d9b95a55}
.brand{font:800 20px Georgia,serif;letter-spacing:1px}.version{font:11px sans-serif;color:#9eb5dd}.res{display:flex;gap:6px;margin-top:6px}.pill{padding:5px 8px;border:1px solid #ffffff20;border-radius:999px;background:#0b1830;font-size:12px}
.hero{height:300px;margin:0 -12px;position:relative;background:url("astra_art.png") 28% 22%/300% auto no-repeat;border-bottom:1px solid #e6c56555}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#071126 0,transparent 55%),linear-gradient(90deg,transparent 40%,#071126cc)}
.heroText{position:absolute;z-index:2;right:15px;bottom:28px;text-align:right}.heroText small{color:#d8c37b}.heroText h1{font:800 30px Georgia,serif;margin:2px 0;text-shadow:0 2px 14px #000}.heroText b{color:#ffd966}
.panel{margin:12px 0;padding:13px;background:linear-gradient(145deg,#0b1730dd,#071020dd);border:1px solid #d7b65a38;border-radius:16px;box-shadow:0 12px 30px #0005}h2,h3{margin:3px 0 9px}.muted{font-size:12px;color:#a9b8d5}
.btn{border:1px solid #e6cb7555;border-radius:13px;padding:12px;font-weight:800;background:linear-gradient(135deg,#234a9c,#6b42bd);box-shadow:inset 0 1px #fff2,0 6px 18px #0005}.btn.gold{background:linear-gradient(135deg,#a56a16,#f0c85e);color:#241500}.btn:active{transform:scale(.98)}.row{display:flex;gap:8px}.row>*{flex:1}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{position:relative;overflow:hidden;background:#07101f;border:1px solid #ffffff1c;border-radius:13px;padding:9px}.card.sel{outline:2px solid #f1cc61}.portrait{height:118px;margin:-9px -9px 8px;background:url("astra_art.png") center/cover no-repeat}.p0{background-position:24% 24%;background-size:310%}.p1{background-position:72% 27%;background-size:310%}.p2{background-position:78% 65%;background-size:290%}.p3{background-position:25% 65%;background-size:290%}.p4{background-position:50% 45%;background-size:250%}
.stars{color:#ffd55b;font-size:12px;text-shadow:0 0 8px #ffb700}.name{font-weight:800;font-size:13px}.stat{font-size:10px;color:#aebbd3}.badge{position:absolute;right:6px;top:6px;padding:3px 6px;border-radius:8px;background:#071020dd;border:1px solid #e9c85d77;font-size:10px}
.stage{width:100%;margin:6px 0;padding:12px;display:flex;justify-content:space-between;background:#101d38;border:1px solid #ffffff20;border-radius:12px;text-align:left}.stage.lock{opacity:.4}.stage.clear{border-color:#5ee2a766}
.enemy{text-align:center}.enemyPic{height:180px;border-radius:14px;background:url("astra_art.png") 77% 68%/210% auto no-repeat;box-shadow:inset 0 0 40px #000}.hp{height:13px;background:#2a3043;border-radius:99px;overflow:hidden;margin:8px 0}.hp i{display:block;height:100%;background:linear-gradient(90deg,#e72d55,#ff9855);transition:.3s}.log{height:150px;overflow:auto;background:#02050d;border-radius:10px;padding:8px;font-size:11px;line-height:1.55}.good{color:#74efad}.bad{color:#ff8197}
.summonVisual{height:240px;margin:-13px -13px 8px;border-radius:16px 16px 0 0;background:url("astra_art.png") 52% 84%/210% auto no-repeat;position:relative}.summonVisual:after{content:"TOUCH THE STAR GATE";position:absolute;left:0;right:0;bottom:10px;text-align:center;font:700 12px Georgia;color:#ffe28c;text-shadow:0 2px 5px #000}
.result{text-align:center;font-weight:900;min-height:42px;padding:8px}.screen{display:none}.screen.on{display:block}
.detail{position:fixed;inset:0;z-index:60;background:#020611ee;display:none;overflow:auto;padding:20px 14px 100px}.detail.on{display:block}.detailArt{height:380px;border-radius:18px;background:url("astra_art.png") 26% 24%/210% auto no-repeat;border:1px solid #e8c76666}.close{position:fixed;right:18px;top:18px;z-index:70;border:1px solid #fff4;background:#071020dd;border-radius:99px;padding:9px 12px}
nav{position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#030817f5;border-top:1px solid #d7b65a44;padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}nav button{border:0;background:none;color:#9aa8c5;font-size:10px}nav b{display:block;font-size:20px}nav button.on{color:#ffe18a}

.gachaFx{position:fixed;inset:0;z-index:100;background:radial-gradient(circle,#244ca0 0,#06091a 45%,#000 100%);display:none;align-items:center;justify-content:center;overflow:hidden}
.gachaFx.on{display:flex}.gate{width:180px;height:180px;border:4px solid #7ec8ff;border-radius:50%;box-shadow:0 0 25px #69bfff,0 0 80px #674cff,inset 0 0 35px #77cfff;animation:spin 1.2s linear infinite;position:relative}
.gate:before,.gate:after{content:"";position:absolute;inset:18px;border:2px dashed #ffe585;border-radius:50%;animation:spin .8s linear infinite reverse}.gate:after{inset:55px;background:#fff;box-shadow:0 0 35px #fff,0 0 90px #8bdcff;border:0;animation:pulse .7s ease-in-out infinite alternate}
.gachaFx.r7{background:radial-gradient(circle,#fff5a0 0,#7047c9 27%,#07102a 55%,#000 100%)}.gachaFx.r7 .gate{border-color:#ffe36b;box-shadow:0 0 30px #fff08a,0 0 100px #d054ff,inset 0 0 45px #fff}
.gachaMsg{position:absolute;bottom:18%;font:900 20px Georgia,serif;letter-spacing:2px;text-shadow:0 2px 12px #000}.flash{animation:flash .45s ease}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{to{transform:scale(1.5);opacity:.6}}@keyframes flash{50%{filter:brightness(4)}}
</style></head>
<body><div class="app">
<header><div class="brand">ASTRA LEGION <span class="version">v0.3</span></div><div class="res"><span class="pill">💎 <b id="gem"></b></span><span class="pill">⚡ <b id="energy"></b>/30</span><span class="pill">🪙 <b id="coin"></b></span></div></header>
<section id="home" class="screen on"><div class="hero"><div class="heroText"><small>★7 LIGHT / CELESTIAL</small><h1>星冠神<br>アストラ</h1><b>「星界の扉を、いま開く。」</b></div></div><div class="panel"><h3>現在の部隊</h3><div id="homeParty" class="cards"></div></div><div class="panel"><h3>今日の星界</h3><div class="muted">初日から止まらない設計。クエスト勝利で💎・コイン・レベルを全部獲得。</div></div></section>
<section id="quest" class="screen"><div class="panel"><h2>⚔️ QUEST</h2><div id="stages"></div></div><div id="battleBox" class="panel" style="display:none"><div class="enemy"><div class="enemyPic"></div><h3 id="enemyName"></h3><div class="hp"><i id="enemyHp"></i></div><div id="enemyHpText" class="muted"></div></div><button class="btn" style="width:100%;margin:10px 0" onclick="fight()">AUTO BATTLE</button><div id="log" class="log"></div></div></section>
<section id="summon" class="screen"><div class="panel"><div class="summonVisual"></div><h2>星門召喚</h2><div id="result" class="result">星門があなたを待っている。</div><div class="muted">★7 3% / ★6 7% / ★5 20% / ★4 30% / ★3 40%<br>30回以内★5+保証・100回以内★7保証</div><div class="row" style="margin-top:10px"><button class="btn" onclick="pull(1)">1回 💎300</button><button class="btn gold" onclick="pull(10)">10回 💎3000</button></div><div class="muted" style="margin-top:8px">★5+まで <b id="pity5"></b> / ★7まで <b id="pity7"></b></div></div></section>
<section id="units" class="screen"><div class="panel"><h2>🛡 UNIT</h2><div class="muted">カードをタップ＝詳細。詳細画面から編成/解除。</div><div id="unitList" class="cards" style="margin-top:10px"></div></div></section>
</div>
<div id="detail" class="detail"><button class="close" onclick="closeDetail()">✕</button><div id="detailArt" class="detailArt"></div><div class="panel"><div id="detailStars" class="stars"></div><h2 id="detailName"></h2><div id="detailStats"></div><hr style="border-color:#ffffff18"><h3 id="detailSkill"></h3><p id="detailDesc" class="muted"></p><button id="partyBtn" class="btn gold" style="width:100%"></button></div></div>
<div id="gachaFx" class="gachaFx"><div class="gate"></div><div id="gachaMsg" class="gachaMsg">STAR GATE OPEN</div></div><nav><button class="on" onclick="tab('home',this)"><b>🏠</b>HOME</button><button onclick="tab('quest',this)"><b>⚔️</b>QUEST</button><button onclick="tab('summon',this)"><b>🌠</b>SUMMON</button><button onclick="tab('units',this)"><b>🛡</b>UNIT</button></nav>
<script>
const U=[
{id:'leon',n:'炎剣士レオン',r:3,attr:'炎',hp:620,atk:125,spd:92,skill:'紅蓮斬',desc:'敵単体へ炎属性の強撃。3ターンごとに威力上昇。',pic:3},
{id:'mina',n:'水術士ミナ',r:3,attr:'水',hp:570,atk:118,spd:108,skill:'蒼流弾',desc:'敵単体へ水弾。安定した魔法ダメージ。',pic:2},
{id:'el',n:'森弓士エル',r:4,attr:'森',hp:700,atk:152,spd:138,skill:'翠穿ち',desc:'高速の矢で攻撃。素早さに優れる。',pic:1},
{id:'volt',n:'雷将ヴォルト',r:4,attr:'雷',hp:750,atk:166,spd:122,skill:'雷迅撃',desc:'雷を纏った一撃。スキル時の倍率が高い。',pic:3},
{id:'sera',n:'氷姫セラ',r:5,attr:'氷',hp:900,atk:205,spd:158,skill:'氷華葬',desc:'氷華を爆発させ大ダメージ。',pic:2},
{id:'lumia',n:'聖女ルミア',r:5,attr:'光',hp:980,atk:165,spd:132,skill:'星癒の祈り',desc:'攻撃しながら味方全員のHPを回復する。',pic:0,heal:true},
{id:'gald',n:'竜帝ガルド',r:6,attr:'炎',hp:1280,atk:270,spd:125,skill:'竜星砕',desc:'高耐久の竜帝。敵へ重い一撃を叩き込む。',pic:4},
{id:'chloe',n:'時姫クロエ',r:6,attr:'時',hp:1050,atk:235,spd:218,skill:'クロノブレイク',desc:'時を裂く高速攻撃。部隊最速クラス。',pic:1},
{id:'ares',n:'神徒アレス',r:6,attr:'光',hp:1180,atk:288,spd:164,skill:'神威連斬',desc:'連続斬撃で敵を圧倒する攻撃型。',pic:3},
{id:'astra',n:'星冠神アストラ',r:7,attr:'光',hp:1650,atk:385,spd:225,skill:'アストラル・ノヴァ',desc:'星界の力を解放。超高威力攻撃＋味方全体を小回復。',pic:0,heal:true},
{id:'nemesis',n:'虚神ネメシス',r:7,attr:'闇',hp:1550,atk:420,spd:210,skill:'虚無終焉',desc:'防御を無視する虚無の一撃。純火力特化。',pic:4}
];
const EN=[{n:'迷いゴブリン',hp:900,atk:65,r:220},{n:'岩殻ビースト',hp:1600,atk:95,r:320},{n:'深淵の番兵',hp:2600,atk:125,r:450},{n:'星喰い獣',hp:3900,atk:170,r:650},{n:'界門竜ゼロス',hp:6000,atk:220,r:1000}];
let S=JSON.parse(localStorage.getItem('astra03')||'null')||{gem:9000,energy:30,coin:0,owned:['leon','mina','el','lumia'],party:['leon','mina','lumia'],p5:0,p7:0,clear:0,lv:{}};let cur=0,detailId=null;
const $=id=>document.getElementById(id), get=id=>U.find(u=>u.id===id), stars=r=>'★'.repeat(r);
function recoverEnergy(){
 const now=Date.now(), step=300000;
 if(S.energy>=30){S.energy=30;S.energyAt=now;return}
 const gained=Math.floor((now-S.energyAt)/step);
 if(gained>0){S.energy=Math.min(30,S.energy+gained);S.energyAt+=gained*step}
}
function updateEnergyTimer(){
 recoverEnergy();
 if($('energy'))$('energy').textContent=S.energy;
 if($('energyTimer')){
  if(S.energy>=30)$('energyTimer').textContent=' MAX';
  else {let left=300000-((Date.now()-S.energyAt)%300000),m=Math.floor(left/60000),sec=Math.floor((left%60000)/1000);$('energyTimer').textContent=` +1 ${m}:${String(sec).padStart(2,'0')}`}
 }
 localStorage.setItem('astra03',JSON.stringify(S));
}
function save(){localStorage.setItem('astra03',JSON.stringify(S));render()}
function card(id){let u=get(id),lv=S.lv[id]||1;return `<div class="card ${S.party.includes(id)?'sel':''}" onclick="showDetail('${id}')"><span class="badge">${u.attr} Lv.${lv}</span><div class="portrait p${u.pic}"></div><div class="stars">${stars(u.r)}</div><div class="name">${u.n}</div><div class="stat">HP ${u.hp+lv*22} / ATK ${u.atk+lv*6} / SPD ${u.spd}</div></div>`}
function render(){$('gem').textContent=S.gem;$('energy').textContent=S.energy;$('coin').textContent=S.coin;$('pity5').textContent=30-S.p5;$('pity7').textContent=100-S.p7;$('homeParty').innerHTML=S.party.map(card).join('');$('unitList').innerHTML=S.owned.map(card).join('');$('stages').innerHTML=EN.map((e,i)=>`<button class="stage ${i>S.clear?'lock':i<S.clear?'clear':''}" ${i>S.clear?'disabled':''} onclick="openStage(${i})"><span>${i+1}-1　${e.n}</span><b>${i<S.clear?'CLEAR':'⚡3'}</b></button>`).join('')}
function tab(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function showDetail(id){detailId=id;let u=get(id),lv=S.lv[id]||1;$('detailArt').className='detailArt p'+u.pic;$('detailStars').textContent=stars(u.r)+' '+u.attr;$('detailName').textContent=u.n;$('detailStats').innerHTML=`HP <b>${u.hp+lv*22}</b>　ATK <b>${u.atk+lv*6}</b>　SPD <b>${u.spd}</b>`;$('detailSkill').textContent='必殺技：'+u.skill;$('detailDesc').textContent=u.desc;$('partyBtn').textContent=S.party.includes(id)?'部隊から外す':'部隊に編成';$('partyBtn').onclick=()=>toggleParty(id);$('detail').classList.add('on')}
function closeDetail(){$('detail').classList.remove('on')}
function toggleParty(id){let i=S.party.indexOf(id);if(i>=0){if(S.party.length>1)S.party.splice(i,1)}else if(S.party.length<3)S.party.push(id);save();showDetail(id)}
function rarity(){if(S.p7>=99)return 7;if(S.p5>=29)return Math.random()<.2?7:5;let x=Math.random()*100;return x<3?7:x<10?6:x<30?5:x<60?4:3}
function pull(n){
 let cost=n*300;if(S.gem<cost){$('result').textContent='💎が足りない！ クエストで稼ごう。';return}
 S.gem-=cost;let out=[];
 for(let i=0;i<n;i++){S.p5++;S.p7++;let r=rarity();if(r>=5)S.p5=0;if(r===7)S.p7=0;let pool=U.filter(u=>u.r===r),u=pool[Math.floor(Math.random()*pool.length)];if(!S.owned.includes(u.id))S.owned.push(u.id);else S.coin+=r*60;out.push(u)}
 out.sort((a,b)=>b.r-a.r);let u=out[0],fx=$('gachaFx'),msg=$('gachaMsg');
 fx.className='gachaFx on'+(u.r===7?' r7':'');msg.textContent=u.r===7?'★7 CELESTIAL SIGNAL':'STAR GATE OPEN';
 setTimeout(()=>{msg.textContent=stars(u.r)+' '+u.n;fx.classList.add('flash')},1100);
 setTimeout(()=>{fx.className='gachaFx';$('result').innerHTML=`<div class="stars" style="font-size:20px">${stars(u.r)}</div>${u.n}<div class="muted">${n}体召喚完了 / 最高レア表示</div>`;save();showDetail(u.id)},2100)
}
function openStage(i){cur=i;let e=EN[i];$('battleBox').style.display='block';$('enemyName').textContent=e.n;$('enemyHp').style.width='100%';$('enemyHpText').textContent=`HP ${e.hp} / ${e.hp}`;$('log').innerHTML='<span class="good">部隊出撃。星界戦闘システム起動。</span>';$('battleBox').scrollIntoView({behavior:'smooth'})}
function fight(){if(S.energy<3){$('log').innerHTML+='<div class="bad">⚡エネルギー不足。</div>';return}if(S.energy===30)S.energyAt=Date.now();S.energy-=3;let base=EN[cur],e={hp:base.hp,atk:base.atk},party=S.party.map(id=>{let u=get(id),lv=S.lv[id]||1;return{u,lv,hp:u.hp+lv*22,max:u.hp+lv*22}}),lines=[];for(let round=1;round<=30&&e.hp>0&&party.some(x=>x.hp>0);round++){party.filter(x=>x.hp>0).sort((a,b)=>b.u.spd-a.u.spd).forEach(x=>{if(e.hp<=0)return;let skill=round%3===0,d=Math.floor((x.u.atk+x.lv*6)*(.88+Math.random()*.25)*(skill?1.75:1));e.hp-=d;lines.push(`${skill?'✨ '+x.u.skill+'！ ':'⚔️ '}${x.u.n} → ${d} damage`);if(skill&&x.u.heal){party.forEach(p=>p.hp=Math.min(p.max,p.hp+180));lines.push('<span class="good">✦ 味方全体HP回復</span>')}});if(e.hp>0){let a=party.filter(x=>x.hp>0),t=a[Math.floor(Math.random()*a.length)],d=Math.floor(e.atk*(.85+Math.random()*.3));t.hp-=d;lines.push(`<span class="bad">${base.n} → ${t.u.n} ${d} damage</span>`)}}$('enemyHp').style.width=Math.max(0,e.hp/base.hp*100)+'%';$('enemyHpText').textContent=`HP ${Math.max(0,e.hp)} / ${base.hp}`;if(e.hp<=0){S.gem+=base.r;S.coin+=base.r;S.clear=Math.max(S.clear,Math.min(EN.length-1,cur+1));S.party.forEach(id=>S.lv[id]=(S.lv[id]||1)+1);lines.push(`<span class="good">🏆 VICTORY！ 💎${base.r} / 🪙${base.r} / 部隊Lv+1</span>`)}else lines.push('<span class="bad">敗北。編成を変えて再挑戦！</span>');$('log').innerHTML=lines.slice(-20).join('<br>');save()}
recoverEnergy();render();updateEnergyTimer();setInterval(updateEnergyTimer,1000);
</script></body></html>
